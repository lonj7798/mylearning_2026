<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>boson-agent: off-policy SFT vs on-policy distillation</title>
<style>
  :root{--bg:#0f1420;--panel:#171e2e;--ink:#e7ecf5;--dim:#93a1bd;--line:#2c3852;
        --env:#5aa9e6;--student:#f2c14e;--teacher:#4ade80;--off:#e07a5f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);padding:20px;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px;max-width:720px}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tabs button{background:#101725;border:1px solid var(--line);color:var(--ink);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
  .tabs button.on{background:#22304a;border-color:#4d6a9e;font-weight:600}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;max-width:800px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin:8px 2px 0}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .note{margin-top:12px;font-size:13px;color:var(--dim);max-width:760px}
  .note b{color:var(--ink)}
  text{font-family:inherit}
</style>
</head>
<body>
  <h1>boson-agent seller: what on-policy distillation changes</h1>
  <div class="sub">Same environment (scenario skeleton + live customer), different training signal for the <b>seller</b> — the model you ship. Toggle to compare.</div>

  <div class="tabs">
    <button id="tA" class="on" onclick="show('cur')">Current · off-policy SFT</button>
    <button id="tB" onclick="show('opd')">Proposed · on-policy distillation</button>
  </div>

  <div class="panel">
    <svg id="svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-label="pipeline diagram"></svg>
    <div class="legend">
      <span><i style="background:var(--env)"></i>environment (scenario + customer)</span>
      <span><i style="background:var(--student)"></i>seller = student (deployed)</span>
      <span><i style="background:var(--teacher)"></i>teacher (grades)</span>
      <span><i style="background:var(--off)"></i>off-policy path</span>
    </div>
  </div>
  <div class="note" id="note"></div>

<script>
var NS="http://www.w3.org/2000/svg";
function E(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
function box(svg,x,y,w,h,title,sub,color){
  svg.appendChild(E("rect",{x:x,y:y,width:w,height:h,rx:9,fill:"#101725",stroke:color,"stroke-width":2}));
  var t=E("text",{x:x+w/2,y:y+ (sub?24:h/2+5),"text-anchor":"middle",fill:"#e7ecf5","font-size":13,"font-weight":"600"});t.textContent=title;svg.appendChild(t);
  if(sub){var s=E("text",{x:x+w/2,y:y+42,"text-anchor":"middle",fill:"#93a1bd","font-size":11});s.textContent=sub;svg.appendChild(s);}
}
function arrow(svg,x1,y1,x2,y2,label,color,dash){
  svg.appendChild(E("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:color,"stroke-width":2,"marker-end":"url(#ah)","stroke-dasharray":dash||""}));
  if(label){var mx=(x1+x2)/2,my=(y1+y2)/2;
    var t=E("text",{x:mx,y:my-6,"text-anchor":"middle",fill:color,"font-size":11});t.textContent=label;svg.appendChild(t);}
}
function defs(svg,color){
  var d=E("defs",{});var m=E("marker",{id:"ah",markerWidth:10,markerHeight:10,refX:8,refY:3,orient:"auto",markerUnits:"strokeWidth"});
  m.appendChild(E("path",{d:"M0,0 L8,3 L0,6 Z",fill:"#93a1bd"}));d.appendChild(m);svg.appendChild(d);
}

function render(mode){
  var svg=document.getElementById("svg");svg.innerHTML="";defs(svg);
  // shared environment column
  box(svg,30,24,180,50,"Scenario skeleton","stages · personas · barge-ins","#3f5a86");
  box(svg,30,120,180,60,"Customer","live rotation · on-policy env","var(--env)");
  box(svg,270,120,190,60,"Seller","boson Qwen3.6-27B","var(--student)");
  box(svg,30,220,430,38,"Relay orchestrator  (turn loop · compaction · barge-in cut)","","#3f5a86");
  arrow(svg,120,74,120,120,"","#3f5a86");
  arrow(svg,210,150,270,150,"","var(--env)");
  arrow(svg,270,164,210,164,"","var(--student)");

  if(mode==='cur'){
    document.getElementById('tA').classList.add('on');document.getElementById('tB').classList.remove('on');
    box(svg,560,120,190,60,"Transcripts","export/synthetic_writer","#3f5a86");
    box(svg,560,222,190,48,"SFT","cross-entropy","var(--off)");
    box(svg,560,312,190,56,"Seller checkpoint","Qwen3.6-27B-Lina-chk-*","var(--student)");
    arrow(svg,460,150,560,150,"generated turns","#93a1bd");
    arrow(svg,655,180,655,222,"","#93a1bd");
    arrow(svg,655,270,655,312,"off-policy","var(--off)");
    var w=E("text",{x:655,y:300,"text-anchor":"middle",fill:"var(--off)","font-size":11});w.textContent="(forward KL, teacher-visited states only)";svg.appendChild(w);
    document.getElementById('note').innerHTML='<b>Today:</b> the seller is puppeted to produce transcripts, then trained by <b style="color:var(--off)">off-policy SFT</b> on them — forward-KL cross-entropy over states the generation pipeline visited. The moment the deployed seller reaches a novel state (an unusual objection, a barge-in recovery), it was never graded there, so error compounds over the 20–50-turn call.';
  } else {
    document.getElementById('tB').classList.add('on');document.getElementById('tA').classList.remove('on');
    box(svg,560,110,200,60,"Teacher","large Qwen · or Claude via GOLD","var(--teacher)");
    box(svg,560,210,200,54,"Reverse-KL / token","advantage = −KL","var(--teacher)");
    box(svg,300,330,320,74,"Token mask","GRADE seller tokens incl. tool_use  ·  MASK customer + tool_result","#3f5a86");
    arrow(svg,460,145,560,140,"seller samples (on-policy)","var(--teacher)");
    arrow(svg,660,170,660,210,"grade each token","#93a1bd");
    // update loop back to seller
    svg.appendChild(E("path",{d:"M560,237 C420,237 380,200 365,182",fill:"none",stroke:"var(--student)","stroke-width":2,"marker-end":"url(#ah)","stroke-dasharray":"5 4"}));
    var u=E("text",{x:470,y:250,"text-anchor":"middle",fill:"var(--student)","font-size":11});u.textContent="per-token update (reuse RL loop)";svg.appendChild(u);
    arrow(svg,365,258,430,330,"","#3f5a86");
    document.getElementById('note').innerHTML='<b>Proposed:</b> the relay becomes an <b style="color:var(--teacher)">on-policy rollout environment</b> — the <b style="color:var(--student)">seller samples its own turns</b> inside the fixed scenario skeleton, and a teacher grades each seller-generated token by <b>reverse KL</b> (mask the customer and tool_result). The student is corrected in the states it actually reaches — DAgger at token level — with lmbda→1, beta toward reverse KL, and per-token clipping.';
  }
}
function show(m){render(m);}
render('cur');
</script>
</body>
</html>
