<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Positional Encoding Comparison — Ch-06</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  color: #e0e0e0;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
}
h1 { font-size: 22px; color: #e94560; margin-bottom: 8px; }
.subtitle { font-size: 13px; color: #888; margin-bottom: 32px; text-align: center; max-width: 650px; }

.methods-row {
  display: flex;
  gap: 12px;
  margin-bottom: 32px;
  flex-wrap: wrap;
  justify-content: center;
}
.method-btn {
  padding: 10px 20px;
  border: 2px solid #333;
  background: #16213e;
  color: #aaa;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
}
.method-btn:hover { border-color: #666; color: #e0e0e0; }
.method-btn.active { border-color: var(--mc); color: var(--mc); background: rgba(233,69,96,0.1); }

.comparison-grid {
  width: 100%;
  max-width: 1000px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 32px;
}
@media (max-width: 700px) { .comparison-grid { grid-template-columns: 1fr; } }

.detail-card {
  background: #16213e;
  border-radius: 12px;
  padding: 24px;
  border-top: 3px solid var(--mc, #e94560);
}
.detail-card h3 {
  font-size: 15px;
  color: var(--mc, #e94560);
  margin-bottom: 12px;
}
.detail-card .formula {
  font-family: monospace;
  font-size: 13px;
  color: #4ecdc4;
  background: #0a1628;
  padding: 10px 14px;
  border-radius: 6px;
  margin-bottom: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
}
.detail-card .props {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.prop-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  padding: 4px 0;
  border-bottom: 1px solid #222;
}
.prop-label { color: #888; }
.prop-value { font-weight: 600; }
.prop-good { color: #4ecdc4; }
.prop-bad { color: #e94560; }
.prop-neutral { color: #ffd93d; }

.timeline-section {
  width: 100%;
  max-width: 1000px;
  margin-bottom: 32px;
}
.timeline-section h2 {
  font-size: 16px;
  color: #4ecdc4;
  margin-bottom: 20px;
  text-align: center;
}

.timeline {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  position: relative;
  padding: 40px 0;
}
.timeline::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 10%;
  right: 10%;
  height: 3px;
  background: linear-gradient(90deg, #e94560, #4ecdc4, #ffd93d, #a29bfe, #fd79a8);
  transform: translateY(-50%);
}
.tl-node {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 100px;
  cursor: pointer;
}
.tl-dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 3px solid #1a1a2e;
  margin-bottom: 8px;
  transition: transform 0.2s;
}
.tl-node:hover .tl-dot { transform: scale(1.3); }
.tl-year { font-size: 11px; color: #888; font-weight: 700; }
.tl-name { font-size: 12px; font-weight: 600; margin-top: 4px; text-align: center; }
.tl-extra { font-size: 10px; color: #555; margin-top: 2px; text-align: center; max-width: 90px; }

.radar-section {
  width: 100%;
  max-width: 1000px;
  background: #16213e;
  border-radius: 12px;
  padding: 28px;
  margin-bottom: 24px;
}
.radar-section h2 {
  font-size: 14px;
  color: #ffd93d;
  margin-bottom: 20px;
  text-align: center;
}
.radar-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.radar-table th {
  padding: 10px;
  text-align: center;
  color: #888;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 2px solid #333;
}
.radar-table th:first-child { text-align: left; }
.radar-table td {
  padding: 10px;
  text-align: center;
  border-bottom: 1px solid #222;
}
.radar-table td:first-child { text-align: left; font-weight: 600; }
.score-bar {
  display: inline-block;
  height: 8px;
  border-radius: 4px;
  vertical-align: middle;
  margin-right: 6px;
}
</style>
</head>
<body>

<h1>Positional Encoding: Method Comparison</h1>
<p class="subtitle">
  From sinusoidal (2017) to iRoPE (2025) -- each method solves a failure of its predecessor.
  Click a method to see its details, or scroll to compare all methods across key dimensions.
</p>

<div class="timeline-section">
  <div class="timeline" id="timeline"></div>
</div>

<div class="comparison-grid" id="compGrid"></div>

<div class="radar-section">
  <h2>Property Comparison Matrix</h2>
  <table class="radar-table">
    <thead>
      <tr>
        <th>Property</th>
        <th>Sinusoidal</th>
        <th>Learned</th>
        <th>ALiBi</th>
        <th>RoPE</th>
        <th>iRoPE</th>
      </tr>
    </thead>
    <tbody id="radarBody"></tbody>
  </table>
</div>

<script>
const methods = [
  {
    id: 'sinusoidal',
    name: 'Sinusoidal',
    year: 2017,
    color: '#e94560',
    models: 'Original Transformer, BERT',
    formula: 'PE(pos, 2i) = sin(pos / 10000^(2i/d))\nPE(pos, 2i+1) = cos(pos / 10000^(2i/d))\ninput = token_emb + PE',
    type: 'Absolute, Additive',
    params: 'Zero (fixed)',
    where: 'Added to input embeddings',
    extrapolation: 'Theoretical but poor in practice',
    recency: 'None',
    longRange: 'Moderate',
    notes: 'Contains rotation matrices in the math (angle addition theorem) but applies them additively, polluting semantic signal.'
  },
  {
    id: 'learned',
    name: 'Learned',
    year: 2019,
    color: '#e9456099',
    models: 'GPT-2, GPT-3',
    formula: 'W_p in R^(L x d)\ninput_t = token_emb_t + W_p[t]\nW_p is trained end-to-end',
    type: 'Absolute, Additive',
    params: 'L x d (e.g., 25M for GPT-3)',
    where: 'Added to input embeddings',
    extrapolation: 'None (hard ceiling at L)',
    recency: 'Learned (data-dependent)',
    longRange: 'Moderate',
    notes: 'Flexible but cannot generalize beyond training length. Each position is independent -- no structural prior about adjacency.'
  },
  {
    id: 'alibi',
    name: 'ALiBi',
    year: 2022,
    color: '#ffd93d',
    models: 'BLOOM, MPT',
    formula: 'attn(q_i, k_j) = q_i^T k_j / sqrt(d) - m_h * |i-j|\nm_h = 2^(-8h/H)  (geometric slopes)',
    type: 'Relative, Additive bias',
    params: 'Zero (fixed slopes)',
    where: 'Bias on attention logits',
    extrapolation: 'Good (2x validated)',
    recency: 'Strong (linear penalty)',
    longRange: 'Weak (distance penalty suppresses)',
    notes: 'Token embeddings are purely semantic -- cleanest separation of position and content. But strong recency bias limits long-range retrieval.'
  },
  {
    id: 'rope',
    name: 'RoPE',
    year: 2021,
    color: '#4ecdc4',
    models: 'LLaMA 1/2/3, Mistral, Qwen, PaLM',
    formula: 'f(q, m) = R(m*theta) * q\nR = block-diag rotation matrix\ntheta_j = 10000^(-2j/d)\ndot(R(m)q, R(n)k) = dot(q, R(n-m)k)',
    type: 'Relative, Multiplicative',
    params: 'Zero (fixed frequencies)',
    where: 'Rotation of Q and K vectors',
    extrapolation: 'Limited (needs YaRN/NTK)',
    recency: 'Soft (decaying dot product)',
    longRange: 'Strong (preserves global attention)',
    notes: 'Unique solution to "inner product depends on relative position." Derived from first principles. Universal adoption since 2023.'
  },
  {
    id: 'irope',
    name: 'iRoPE',
    year: 2025,
    color: '#fd79a8',
    models: 'Llama 4 Scout, Llama 4 Maverick',
    formula: 'Layer 2k:   RoPE attention\nLayer 2k+1: No-PE attention (content only)\n+ inference-time temperature scaling',
    type: 'Mixed (relative + none)',
    params: 'Zero',
    where: 'Alternating layers',
    extrapolation: 'Excellent (40x: 256K to 10M)',
    recency: 'Adaptive (per-layer)',
    longRange: 'Excellent (no-PE layers are length-invariant)',
    notes: 'Less positional encoding = better length generalization. No-PE layers develop content-based attention that works at any length.'
  }
];

const properties = [
  { name: 'Extrapolation', key: 'extrapolation', scores: [2, 0, 4, 2, 5] },
  { name: 'Long-range attention', key: 'longRange', scores: [3, 3, 1, 4, 5] },
  { name: 'Semantic purity', key: 'semantic', scores: [1, 1, 5, 4, 4] },
  { name: 'No learned params', key: 'noparams', scores: [5, 0, 5, 5, 5] },
  { name: 'Extension ecosystem', key: 'extension', scores: [1, 0, 1, 5, 4] },
  { name: 'Adoption (2025)', key: 'adoption', scores: [1, 0, 1, 5, 3] },
  { name: 'Implementation simplicity', key: 'simplicity', scores: [4, 5, 5, 3, 3] },
];

let selected = [3, 4]; // RoPE and iRoPE by default

function renderTimeline() {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  methods.forEach((m, i) => {
    const node = document.createElement('div');
    node.className = 'tl-node';
    node.onclick = () => toggleSelection(i);
    node.innerHTML = `
      <div class="tl-dot" style="background:${m.color};"></div>
      <div class="tl-year">${m.year}</div>
      <div class="tl-name" style="color:${m.color};">${m.name}</div>
      <div class="tl-extra">${m.models.split(',')[0]}</div>
    `;
    tl.appendChild(node);
  });
}

function toggleSelection(i) {
  const idx = selected.indexOf(i);
  if (idx >= 0) {
    if (selected.length > 1) selected.splice(idx, 1);
  } else {
    if (selected.length >= 3) selected.shift();
    selected.push(i);
  }
  renderComparison();
  renderRadar();
}

function renderComparison() {
  const grid = document.getElementById('compGrid');
  grid.innerHTML = '';
  selected.forEach(i => {
    const m = methods[i];
    const card = document.createElement('div');
    card.className = 'detail-card';
    card.style.setProperty('--mc', m.color);
    card.innerHTML = `
      <h3>${m.name} (${m.year})</h3>
      <div class="formula">${m.formula}</div>
      <div class="props">
        <div class="prop-row"><span class="prop-label">Type</span><span class="prop-value">${m.type}</span></div>
        <div class="prop-row"><span class="prop-label">Learned params</span><span class="prop-value">${m.params}</span></div>
        <div class="prop-row"><span class="prop-label">Where position enters</span><span class="prop-value">${m.where}</span></div>
        <div class="prop-row"><span class="prop-label">Extrapolation</span><span class="prop-value">${m.extrapolation}</span></div>
        <div class="prop-row"><span class="prop-label">Recency bias</span><span class="prop-value">${m.recency}</span></div>
        <div class="prop-row"><span class="prop-label">Long-range</span><span class="prop-value">${m.longRange}</span></div>
        <div class="prop-row"><span class="prop-label">Models</span><span class="prop-value" style="font-size:11px;">${m.models}</span></div>
      </div>
      <div style="margin-top:12px; font-size:11px; color:#666; font-style:italic;">${m.notes}</div>
    `;
    grid.appendChild(card);
  });
}

function renderRadar() {
  const body = document.getElementById('radarBody');
  body.innerHTML = '';
  const colors = methods.map(m => m.color);

  properties.forEach(prop => {
    const tr = document.createElement('tr');
    const td0 = document.createElement('td');
    td0.textContent = prop.name;
    tr.appendChild(td0);

    prop.scores.forEach((score, i) => {
      const td = document.createElement('td');
      const width = score * 20;
      const color = colors[i];
      const isSelected = selected.includes(i);
      td.innerHTML = `<span class="score-bar" style="width:${width}px; background:${isSelected ? color : '#333'};"></span>${score}/5`;
      td.style.color = isSelected ? '#e0e0e0' : '#444';
      tr.appendChild(td);
    });

    body.appendChild(tr);
  });
}

renderTimeline();
renderComparison();
renderRadar();
</script>

</body>
</html>
